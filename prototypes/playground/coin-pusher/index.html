<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Pusher</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0e2a3a;
    font-family: "Trebuchet MS", Tahoma, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    touch-action: none; /* taps and holds drop coins instead of scrolling */
  }

  .hud {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
  }
  .panel {
    background: rgba(4, 20, 30, 0.75);
    border: 2px solid #f6c21c;
    border-radius: 10px;
    padding: 4px 10px;
    text-align: center;
    color: #fff;
    min-width: 58px;
  }
  .panel b { display: block; font-size: 20px; line-height: 1.1; color: #ffe27a; font-variant-numeric: tabular-nums; }
  .panel span { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; }

  .refill {
    pointer-events: auto;
    display: none;
    font: bold 14px "Trebuchet MS", Tahoma, sans-serif;
    color: #fff;
    background: #e8483f;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 6px 16px;
    min-height: 40px;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    touch-action: manipulation;
    align-self: center;
  }
  .refill.show { display: block; }
  .refill:active { transform: translateY(1px); box-shadow: none; }
  .refill:focus-visible { outline: 2px dashed #fff; outline-offset: 2px; }

  .hint {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    pointer-events: none;
    transition: opacity 0.6s;
    padding: 0 12px;
  }
  .hint small { display: block; font-weight: normal; font-size: 12px; margin-top: 2px; opacity: 0.9; }
  .hint.gone { opacity: 0; }
  .hint .touch { display: none; }
  @media (pointer: coarse) {
    .hint .mouse { display: none; }
    .hint .touch { display: block; }
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Coin pusher. Tap or click above the machine to drop a coin at that spot; hold to keep dropping. Keyboard: arrow keys to aim, space to drop."></canvas>

<div class="hud">
  <div class="panel"><b id="bank">30</b><span>Coins</span></div>
  <button class="refill" id="refill" type="button">+20 coins</button>
  <div class="panel"><b id="won">0</b><span>Won</span></div>
</div>

<div class="hint" id="hint">Drop coins, push coins!<small class="mouse">click where to drop &middot; hold to keep dropping &middot; or &larr; &rarr; and space</small><small class="touch">tap where to drop &middot; hold to keep dropping</small></div>

<div class="sr" aria-live="polite" id="live"></div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     Coin pusher on a 2D canvas with a small perspective camera.

     The world is in metres-ish units: x across the machine, y up, z from
     the front edge (z = 0) back to the rear wall (z = DEPTH). Coins live
     on one of two flat layers:

       shelf  the playfield. The pusher's front face sweeps back and
              forth across it and shoves coins toward the front edge.
       top    the pusher's own top surface. Coins land here from the
              slot, ride along with it, and get scraped forward by the
              fixed back wall each time it pulls back, until they spill
              over its front lip onto the shelf.

     Coins have no velocity: they only move when something pushes them
     (they're heavy and sit flat). Each frame we move the pusher, then
     relax all the overlaps a few times. A coin whose centre crosses
     the front edge falls into the tray and pays out. Near the front,
     the side walls stop, and coins pushed off there are lost.
     ------------------------------------------------------------------ */

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var HALF_W = 0.5;
  var DEPTH = 1.0;
  var COIN_R = 0.05;
  var COIN_T = 0.012;               // thickness
  var PUSH_MIN = 0.5, PUSH_MAX = 0.82;
  var PUSH_PERIOD = 3.2;            // seconds per full stroke
  var PUSH_H = 0.09;                // pusher block height
  var WALL_START = 0.28;            // side walls only exist behind this z: the front corners are gutters
  var WALL_H = 0.55;

  var TYPES = {
    coin: { value: 1 },
    gold: { value: 5 },
    star: { value: 20 }
  };

  // ---- camera ----
  var CAM = { y: 1.9, z: -1.25, pitch: 47 * Math.PI / 180 };
  var cosP = Math.cos(CAM.pitch), sinP = Math.sin(CAM.pitch);
  var W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;

  function rawProject(x, y, z) {
    var dy = y - CAM.y, dz = z - CAM.z;
    var yc = dy * cosP + dz * sinP;
    var zc = dz * cosP - dy * sinP;
    return { x: x / zc, y: -yc / zc, d: zc };
  }
  function P(x, y, z) {
    var p = rawProject(x, y, z);
    return { x: OX + p.x * S, y: OY + p.y * S, k: S / p.d };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    var pts = [
      rawProject(-HALF_W - 0.05, -0.28, -0.08), rawProject(HALF_W + 0.05, -0.28, -0.08),
      rawProject(-HALF_W - 0.05, WALL_H + 0.12, DEPTH), rawProject(HALF_W + 0.05, WALL_H + 0.12, DEPTH)
    ];
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pts.forEach(function (p) {
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    });
    var topPad = 58, botPad = 8;
    S = Math.min((W - 12) / (maxX - minX), (H - topPad - botPad) / (maxY - minY));
    OX = W / 2 - (minX + maxX) / 2 * S;
    OY = topPad + (H - topPad - botPad - (maxY - minY) * S) / 2 - minY * S;
  }

  /* ---------- state ---------- */

  var shelf = [], top = [], dropping = [], falling = [], popups = [];
  var bank = 30, won = 0, dropsSinceStar = 0;
  var pushT = 0, face = PUSH_MIN, lastFace = PUSH_MIN;
  var aimX = 0, aimShown = false;

  try {
    var saved = JSON.parse(localStorage.getItem('coinpusher-bank') || 'null');
    if (saved && typeof saved.bank === 'number') { bank = saved.bank; won = saved.won || 0; }
  } catch (e) {}

  var elBank = document.getElementById('bank');
  var elWon = document.getElementById('won');
  var elRefill = document.getElementById('refill');
  var elHint = document.getElementById('hint');
  var elLive = document.getElementById('live');

  function save() {
    try { localStorage.setItem('coinpusher-bank', JSON.stringify({ bank: bank, won: won })); } catch (e) {}
  }
  function updateHud() {
    elBank.textContent = bank;
    elWon.textContent = won;
    elRefill.classList.toggle('show', bank <= 0);
  }

  function makeCoin(x, z, type) {
    return { x: x, z: z, type: type || 'coin', rot: Math.random() * Math.PI * 2 };
  }

  function fillMachine() {
    var i, t;
    for (i = 0; i < 46; i++) {
      t = i % 13 === 5 ? 'gold' : 'coin';
      shelf.push(makeCoin((Math.random() * 2 - 1) * (HALF_W - COIN_R), 0.06 + Math.random() * (PUSH_MIN - 0.1), t));
    }
    shelf.push(makeCoin(0.05, 0.16, 'star'));
    for (i = 0; i < 12; i++) top.push(makeCoin((Math.random() * 2 - 1) * (HALF_W - COIN_R), PUSH_MIN + Math.random() * (DEPTH - PUSH_MIN), 'coin'));
    // Settle the random scatter so nothing starts overlapping.
    for (i = 0; i < 60; i++) {
      relax(shelf, 'shelf'); relax(top, 'top');
      // While setting up, the front edge acts as a wall so nothing pays out for free.
      shelf.forEach(function (c) { c.z = Math.max(c.z, COIN_R * 0.6); c.x = clamp(c.x, -HALF_W + COIN_R, HALF_W - COIN_R); });
    }
  }

  /* ---------- physics ---------- */

  function relax(list, layer) {
    var n = list.length, i, j, a, b, dx, dz, d2, d, push, wa, wb;
    var min = COIN_R * 2, min2 = min * min;
    for (i = 0; i < n; i++) {
      a = list[i];
      for (j = i + 1; j < n; j++) {
        b = list[j];
        dx = b.x - a.x;
        if (dx > min || dx < -min) continue;
        dz = b.z - a.z;
        if (dz > min || dz < -min) continue;
        d2 = dx * dx + dz * dz;
        if (d2 >= min2) continue;
        d = Math.sqrt(d2) || 1e-4;
        // A coin pinned against the pusher (or the back wall) can't give way.
        wa = pinned(a, layer) ? 0 : 1;
        wb = pinned(b, layer) ? 0 : 1;
        if (!wa && !wb) { wa = wb = 1; }
        push = (min - d) / d / (wa + wb);
        a.x -= dx * push * wa; a.z -= dz * push * wa;
        b.x += dx * push * wb; b.z += dz * push * wb;
      }
    }
    for (i = 0; i < n; i++) bounds(list[i], layer);
  }

  function pinned(c, layer) {
    return layer === 'shelf' ? c.z >= face - COIN_R - 0.002 : c.z >= DEPTH - COIN_R - 0.002;
  }

  function bounds(c, layer) {
    if (layer === 'shelf') {
      if (c.z > face - COIN_R) c.z = face - COIN_R;
      if (c.z >= WALL_START) {
        if (c.x < -HALF_W + COIN_R) c.x = -HALF_W + COIN_R;
        if (c.x > HALF_W - COIN_R) c.x = HALF_W - COIN_R;
      }
    } else {
      if (c.z > DEPTH - COIN_R) c.z = DEPTH - COIN_R;
      if (c.x < -HALF_W + COIN_R) c.x = -HALF_W + COIN_R;
      if (c.x > HALF_W - COIN_R) c.x = HALF_W - COIN_R;
    }
  }

  function step(dt) {
    pushT += dt;
    lastFace = face;
    face = PUSH_MIN + (PUSH_MAX - PUSH_MIN) * (0.5 - 0.5 * Math.cos(pushT / PUSH_PERIOD * Math.PI * 2));
    var dFace = face - lastFace;
    var i, c;

    // Coins on top ride with the pusher; the back wall then scrapes them.
    for (i = 0; i < top.length; i++) top[i].z += dFace;

    for (var it = 0; it < 4; it++) { relax(shelf, 'shelf'); relax(top, 'top'); }

    // Spill off the pusher's front lip onto the shelf.
    for (i = top.length - 1; i >= 0; i--) {
      c = top[i];
      if (c.z < face) {
        top.splice(i, 1);
        c.z = face - COIN_R - 0.005;
        c.drop = { y: PUSH_H, vy: 0 };   // short fall to the shelf
        dropping.push(c);
      }
    }

    // Coins falling from the slot or off the lip.
    for (i = dropping.length - 1; i >= 0; i--) {
      c = dropping[i];
      c.drop.vy -= 9.8 * dt;
      c.drop.y += c.drop.vy * dt;
      var floor = c.drop.onTop ? PUSH_H : 0;
      if (c.drop.onTop) c.z += dFace; // falling onto the moving top
      if (c.drop.y <= floor) {
        dropping.splice(i, 1);
        if (c.drop.onTop && c.z < face) { c.z = face - COIN_R - 0.005; floor = 0; c.drop.onTop = false; c.drop.y = PUSH_H; dropping.push(c); continue; }
        delete c.drop;
        (floor ? top : shelf).push(c);
        clink(floor ? 0.5 : 0.35);
      }
    }

    // Off the front edge, or out through a front corner.
    for (i = shelf.length - 1; i >= 0; i--) {
      c = shelf[i];
      var offFront = c.z < 0;
      var offSide = c.z < WALL_START && (c.x < -HALF_W || c.x > HALF_W);
      if (offFront || offSide) {
        shelf.splice(i, 1);
        c.fall = { y: 0, vy: 0.2, vz: offFront ? -0.25 : 0, vx: offSide ? (c.x < 0 ? -0.3 : 0.3) : 0, t: 0, win: offFront };
        falling.push(c);
        if (offFront) payout(c);
        else popup('lost', P(c.x, 0.05, c.z), '#9fb7c4', false);
      }
    }
    for (i = falling.length - 1; i >= 0; i--) {
      c = falling[i];
      c.fall.t += dt;
      c.fall.vy -= 9.8 * dt;
      c.fall.y += c.fall.vy * dt;
      c.z += c.fall.vz * dt;
      c.x += c.fall.vx * dt;
      c.rot += dt * 8;
      if (c.fall.y < -0.35) falling.splice(i, 1);
    }
  }

  function payout(c) {
    var v = TYPES[c.type].value;
    bank += v; won += v;
    updateHud(); save();
    var big = v >= 5;
    popup('+' + v, P(c.x, 0.05, 0), big ? '#ffe27a' : '#ffffff', big);
    clink(1);
    elLive.textContent = 'Won ' + v + (v === 1 ? ' coin' : ' coins') + '. You have ' + bank + '.';
  }

  /* ---------- dropping ---------- */

  var lastDrop = 0;
  function dropCoin() {
    var now = performance.now();
    if (now - lastDrop < 170) return;
    if (bank <= 0) { elLive.textContent = 'Out of coins.'; return; }
    lastDrop = now;
    bank--;
    updateHud(); save();
    dropsSinceStar++;
    var type = 'coin';
    if (dropsSinceStar > 30 && Math.random() < 0.08) { type = 'star'; dropsSinceStar = 0; }
    else if (Math.random() < 0.035) type = 'gold';
    var x = clamp(aimX + (Math.random() - 0.5) * 0.02, -HALF_W + COIN_R, HALF_W - COIN_R);
    var c = makeCoin(x, DEPTH - COIN_R - 0.02 - Math.random() * 0.12, type);
    c.drop = { y: WALL_H, vy: 0, onTop: true };
    dropping.push(c);
    elHint.classList.add('gone');
  }

  elRefill.addEventListener('click', function () {
    bank += 20;
    updateHud(); save();
    canvas.focus({ preventScroll: true });
  });

  /* ---------- sound: a tiny synthesized clink ---------- */

  var audio = null, lastClink = 0;
  function clink(vol) {
    if (!audio) return;
    var now = audio.currentTime;
    if (now - lastClink < 0.03) return;
    lastClink = now;
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 2400 + Math.random() * 1600;
    g.gain.setValueAtTime(0.05 * vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    o.connect(g); g.connect(audio.destination);
    o.start(now); o.stop(now + 0.13);
  }
  function wakeAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }

  /* ---------- drawing ---------- */

  function poly(c, pts) {
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
    c.closePath();
  }

  var COLORS = {
    coin: { face: '#d9dee4', rim: '#8d969f', edge: '#6b737b', mark: '#a9b2bb' },
    gold: { face: '#ffd23f', rim: '#c48a00', edge: '#946700', mark: '#e0a800' },
    star: { face: '#ff5edb', rim: '#a8228e', edge: '#7c1468', mark: '#ffe27a' }
  };

  function drawCoin(c, y, alpha) {
    var col = COLORS[c.type];
    var p = P(c.x, y + COIN_T, c.z);
    var pa = P(c.x, y + COIN_T, c.z - COIN_R), pb = P(c.x, y + COIN_T, c.z + COIN_R);
    var rx = COIN_R * p.k, ry = Math.abs(pa.y - pb.y) / 2;
    if (c.fall) ry *= Math.abs(Math.cos(c.rot)) * 0.8 + 0.2;
    var th = COIN_T * p.k;
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    // edge
    ctx.fillStyle = col.edge;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + th, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(p.x - rx, p.y, rx * 2, th);
    // face
    ctx.fillStyle = col.rim;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col.face;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rx * 0.84, ry * 0.84, 0, 0, Math.PI * 2); ctx.fill();
    if (rx > 6) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(1, ry / rx);
      ctx.rotate(c.rot);
      if (c.type === 'star') {
        ctx.fillStyle = col.mark;
        starPath(ctx, rx * 0.6, rx * 0.26);
        ctx.fill();
      } else {
        ctx.strokeStyle = col.mark;
        ctx.lineWidth = Math.max(1, rx * 0.1);
        ctx.beginPath(); ctx.arc(0, 0, rx * 0.55, 0, Math.PI * 2); ctx.stroke();
        if (c.type === 'gold') {
          ctx.fillStyle = col.mark;
          ctx.font = 'bold ' + Math.round(rx * 0.8) + 'px "Trebuchet MS", Tahoma, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('5', 0, rx * 0.04);
        }
      }
      ctx.restore();
      // glint
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath(); ctx.ellipse(p.x - rx * 0.35, p.y - ry * 0.35, rx * 0.22, ry * 0.12, -0.5, 0, Math.PI * 2); ctx.fill();
    }
    if (alpha !== undefined) ctx.globalAlpha = 1;
  }

  function starPath(c, R, r) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
      if (i) c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath();
  }

  function byDepth(a, b) { return b.z - a.z; }

  function draw(dt, now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Room
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#13394d');
    g.addColorStop(1, '#071821');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Prize tray under the front edge
    var t0 = P(-HALF_W - 0.04, -0.06, 0), t1 = P(HALF_W + 0.04, -0.06, 0);
    var t2 = P(HALF_W + 0.04, -0.28, -0.08), t3 = P(-HALF_W - 0.04, -0.28, -0.08);
    ctx.fillStyle = '#0a1f2b';
    poly(ctx, [t0, t1, t2, t3]); ctx.fill();

    // Back wall with lights
    var bw = [P(-HALF_W, 0, DEPTH), P(HALF_W, 0, DEPTH), P(HALF_W, WALL_H, DEPTH), P(-HALF_W, WALL_H, DEPTH)];
    var wg = ctx.createLinearGradient(0, bw[3].y, 0, bw[0].y);
    wg.addColorStop(0, '#2f86d6');
    wg.addColorStop(1, '#173f6b');
    ctx.fillStyle = wg;
    poly(ctx, bw); ctx.fill();
    for (var i = 0; i < 9; i++) {
      var lp = P(-HALF_W + 0.07 + i * (2 * HALF_W - 0.14) / 8, WALL_H - 0.05, DEPTH);
      var on = ((now / 220 | 0) + i) % 3 === 0;
      ctx.fillStyle = on ? '#ffe27a' : '#5b6f88';
      ctx.beginPath(); ctx.arc(lp.x, lp.y, Math.max(2, lp.k * 0.018), 0, Math.PI * 2); ctx.fill();
    }
    var mp = P(0, WALL_H * 0.6, DEPTH);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = 'bold ' + Math.round(mp.k * 0.09) + 'px "Trebuchet MS", Tahoma, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PUSH YOUR LUCK', mp.x, mp.y);

    // Shelf floor
    var fl = [P(-HALF_W, 0, 0), P(HALF_W, 0, 0), P(HALF_W, 0, DEPTH), P(-HALF_W, 0, DEPTH)];
    var fg = ctx.createLinearGradient(0, fl[2].y, 0, fl[0].y);
    fg.addColorStop(0, '#6b1d6e');
    fg.addColorStop(1, '#b0359c');
    ctx.fillStyle = fg;
    poly(ctx, fl); ctx.fill();
    // front edge strip
    ctx.fillStyle = '#ffd23f';
    poly(ctx, [P(-HALF_W, 0, 0), P(HALF_W, 0, 0), P(HALF_W, -0.035, 0), P(-HALF_W, -0.035, 0)]); ctx.fill();
    // side gutters at the front corners
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    poly(ctx, [P(-HALF_W, 0, 0), P(-HALF_W + 0.02, 0, 0), P(-HALF_W + 0.02, 0, WALL_START), P(-HALF_W, 0, WALL_START)]); ctx.fill();
    poly(ctx, [P(HALF_W - 0.02, 0, 0), P(HALF_W, 0, 0), P(HALF_W, 0, WALL_START), P(HALF_W - 0.02, 0, WALL_START)]); ctx.fill();

    // Pusher top surface and the coins riding on it
    var pt = [P(-HALF_W, PUSH_H, face), P(HALF_W, PUSH_H, face), P(HALF_W, PUSH_H, DEPTH), P(-HALF_W, PUSH_H, DEPTH)];
    ctx.fillStyle = '#c9d3dc';
    poly(ctx, pt); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (i = 1; i < 6; i++) {
      var zz = face + (DEPTH - face) * i / 6;
      var s1 = P(-HALF_W, PUSH_H, zz), s2 = P(HALF_W, PUSH_H, zz);
      ctx.fillRect(s1.x, s1.y, s2.x - s1.x, 1);
    }
    top.sort(byDepth);
    for (i = 0; i < top.length; i++) drawCoin(top[i], PUSH_H);
    dropping.sort(byDepth);
    for (i = 0; i < dropping.length; i++) if (dropping[i].drop.onTop) drawCoin(dropping[i], dropping[i].drop.y);

    // Pusher front face
    var pf = [P(-HALF_W, 0, face), P(HALF_W, 0, face), P(HALF_W, PUSH_H, face), P(-HALF_W, PUSH_H, face)];
    var pg = ctx.createLinearGradient(0, pf[2].y, 0, pf[0].y);
    pg.addColorStop(0, '#f6c21c');
    pg.addColorStop(1, '#c48a00');
    ctx.fillStyle = pg;
    poly(ctx, pf); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    poly(ctx, [P(-HALF_W, 0, face), P(HALF_W, 0, face), P(HALF_W, 0, face - 0.03), P(-HALF_W, 0, face - 0.03)]); ctx.fill();

    // Shelf coins (and ones dropping off the lip)
    shelf.sort(byDepth);
    for (i = 0; i < shelf.length; i++) drawCoin(shelf[i], 0);
    for (i = 0; i < dropping.length; i++) if (!dropping[i].drop.onTop) drawCoin(dropping[i], dropping[i].drop.y);

    // Glass side walls
    ctx.fillStyle = 'rgba(160, 220, 255, 0.12)';
    ctx.strokeStyle = 'rgba(200, 240, 255, 0.5)';
    ctx.lineWidth = 1.5;
    [-1, 1].forEach(function (sx) {
      var wpts = [P(sx * HALF_W, 0, WALL_START), P(sx * HALF_W, 0, DEPTH), P(sx * HALF_W, WALL_H, DEPTH), P(sx * HALF_W, WALL_H * 0.7, WALL_START)];
      poly(ctx, wpts); ctx.fill(); ctx.stroke();
    });

    // Coins falling into the tray / gutters
    for (i = 0; i < falling.length; i++) {
      var f = falling[i];
      drawCoin(f, f.fall.y, Math.max(0, 1 - f.fall.t * 1.6));
    }

    // Drop aim marker
    if (aimShown || keyAimed) {
      var a = P(aimX, WALL_H + 0.06, DEPTH - 0.05), a2 = P(aimX, PUSH_H, DEPTH - 0.08);
      ctx.strokeStyle = 'rgba(255, 226, 122, 0.55)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a2.x, a2.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffe27a';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y + 2);
      ctx.lineTo(a.x - 8, a.y - 10);
      ctx.lineTo(a.x + 8, a.y - 10);
      ctx.closePath(); ctx.fill();
    }

    drawPopups(dt);
  }

  function popup(text, p, color, big) {
    popups.push({ text: text, x: p.x, y: p.y, color: color, big: !!big, t: 0 });
  }
  function drawPopups(dt) {
    for (var i = popups.length - 1; i >= 0; i--) {
      var p = popups[i];
      p.t += dt;
      if (p.t > 1.1) { popups.splice(i, 1); continue; }
      var e = p.t / 1.1;
      ctx.globalAlpha = 1 - e * e;
      ctx.font = 'bold ' + (p.big ? 26 : 18) + 'px "Trebuchet MS", Tahoma, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(4,20,30,0.85)';
      var y = p.y - 6 - e * 36;
      ctx.strokeText(p.text, p.x, y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, y);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- input ---------- */

  var holding = null, keyAimed = false, keys = {};

  function aimFromClient(clientX) {
    var rect = canvas.getBoundingClientRect();
    var p = P(0, PUSH_H, DEPTH - 0.08);
    aimX = clamp((clientX - rect.left - p.x) / p.k, -HALF_W + COIN_R, HALF_W - COIN_R);
  }

  canvas.addEventListener('pointermove', function (e) {
    aimFromClient(e.clientX);
    aimShown = true;
    keyAimed = false;
  });
  canvas.addEventListener('pointerleave', function () { if (!holding) aimShown = false; });
  canvas.addEventListener('pointerdown', function (e) {
    wakeAudio();
    aimFromClient(e.clientX);
    aimShown = true;
    holding = { id: e.pointerId, next: performance.now() + 380 };
    lastDrop = 0;
    dropCoin();
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  function release(e) {
    if (holding && e.pointerId === holding.id) holding = null;
    if (e.pointerType !== 'mouse') aimShown = false;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'BUTTON') return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { keys[e.key] = true; keyAimed = true; e.preventDefault(); }
    if (e.key === ' ' || e.key === 'Enter') { wakeAudio(); keyAimed = true; dropCoin(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  /* ---------- loop ---------- */

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 1 / 20);
    last = now;
    var dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    if (dir) aimX = clamp(aimX + dir * dt * 0.7, -HALF_W + COIN_R, HALF_W - COIN_R);
    if (holding && now >= holding.next) { dropCoin(); holding.next = now + 220; }
    var n = 2, sub = dt / n;
    for (var i = 0; i < n; i++) step(sub);
    draw(dt, now);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  fillMachine();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
