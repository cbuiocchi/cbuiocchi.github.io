<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="db-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b041a"/>
      <stop offset="0.55" stop-color="#24104a"/>
      <stop offset="1" stop-color="#4b1e94"/>
    </linearGradient>
    <radialGradient id="db-glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="db-gilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d1"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- gilded night-sky tile -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="5" fill="url(#db-sky)" stroke="#1a0b08" stroke-width="1.5"/>
  <rect x="4.5" y="4.5" width="39" height="39" rx="3.5" fill="none" stroke="url(#db-gilt)" stroke-width="2"/>
  <rect x="6" y="6" width="36" height="36" rx="2.5" fill="none" stroke="#fff1b8" stroke-opacity="0.5" stroke-width="0.6"/>
  <circle cx="24" cy="28" r="17" fill="url(#db-glow)"/>
  <!-- stars -->
  <circle cx="10.5" cy="11" r="0.9" fill="#fff"/>
  <circle cx="37.5" cy="10" r="0.8" fill="#ffe9a8"/>
  <circle cx="35" cy="17" r="0.6" fill="#fff"/>
  <circle cx="12" cy="19" r="0.6" fill="#ffe9a8"/>
  <!-- back card (purple, gold sigil) -->
  <g transform="translate(24 27) rotate(-14)">
    <rect x="-13" y="-13" width="14" height="20" rx="1.6" fill="#4b1e94" stroke="#1a0b08" stroke-width="1"/>
    <rect x="-11.6" y="-11.6" width="11.2" height="17.2" rx="1" fill="none" stroke="#c9a227" stroke-width="0.9"/>
    <path d="M-6 -6.5 l2.4 3.5 -2.4 3.5 -2.4 -3.5 z" fill="#f5c542"/>
  </g>
  <!-- front card (parchment, four-point star) -->
  <g transform="translate(24 27) rotate(12)">
    <rect x="-3" y="-14" width="14" height="20" rx="1.6" fill="#fbf3dc" stroke="#1a0b08" stroke-width="1"/>
    <rect x="-1.6" y="-12.6" width="11.2" height="17.2" rx="1" fill="none" stroke="#c9a227" stroke-width="0.9"/>
    <path d="M4 -8.6 q0.6 3.4 3.6 4.6 q-3 1.2 -3.6 4.6 q-0.6 -3.4 -3.6 -4.6 q3 -1.2 3.6 -4.6 z" fill="#6a35c9"/>
  </g>
  <!-- crowning star -->
  <path d="M24 6.5 q0.9 3.8 4.2 4.8 q-3.3 1 -4.2 4.8 q-0.9 -3.8 -4.2 -4.8 q3.3 -1 4.2 -4.8 z" fill="url(#db-gilt)" stroke="#1a0b08" stroke-width="0.6"/>
</svg>
