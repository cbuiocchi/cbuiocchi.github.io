<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="wb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e93db"/>
      <stop offset="0.6" stop-color="#5cc4f5"/>
      <stop offset="1" stop-color="#b8ebff"/>
    </linearGradient>
    <clipPath id="wb-tile"><rect x="3" y="3" width="40" height="40" rx="9"/></clipPath>
  </defs>
  <!-- chunky cartoon tile with hard offset shadow -->
  <rect x="5.5" y="5.5" width="40" height="40" rx="9" fill="#0b1a33" fill-opacity="0.85"/>
  <g clip-path="url(#wb-tile)">
    <rect x="3" y="3" width="40" height="40" fill="url(#wb-sky)"/>
    <!-- snow -->
    <circle cx="9" cy="10" r="1.3" fill="#fff"/>
    <circle cx="37" cy="9" r="1.1" fill="#fff"/>
    <circle cx="34" cy="19" r="0.9" fill="#fff" fill-opacity="0.8"/>
    <circle cx="8.5" cy="22" r="0.9" fill="#fff" fill-opacity="0.8"/>
    <circle cx="15" cy="6.5" r="0.8" fill="#fff" fill-opacity="0.8"/>
    <!-- cloud bank -->
    <path d="M3 39 q3 -5 8 -3 q2 -5 8 -3 q3 -4 8 -1 q4 -3 8 1 q5 -1 8 3 V43 H3 Z" fill="#f2fbff" stroke="#0b1a33" stroke-width="2"/>
  </g>
  <rect x="3" y="3" width="40" height="40" rx="9" fill="none" stroke="#0b1a33" stroke-width="2.5"/>
  <!-- speed lines -->
  <g stroke="#fff" stroke-width="2" stroke-linecap="round">
    <path d="M5.5 29 h4.5"/>
    <path d="M6.5 34 h5"/>
    <path d="M7 24 h3.5"/>
  </g>
  <!-- penguin, flapping up and to the right -->
  <g transform="translate(22.5 27) rotate(-22) scale(0.88)" stroke="#0b1a33" stroke-width="2" stroke-linejoin="round">
    <path d="M-12.5 1 l-3.2 -1.6 M-12.5 3 l-3.4 1.4" stroke="#e8b400" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-12.5 2 l-1.5 -1.5 M-12.5 2 l-1.6 1.6" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="0" cy="1" rx="12" ry="7" fill="#123a73"/>
    <ellipse cx="0.5" cy="3.6" rx="9" ry="3.6" fill="#fff" stroke="none"/>
    <circle cx="9.5" cy="-2.5" r="5.6" fill="#123a73"/>
    <circle cx="11.4" cy="-3.8" r="2.1" fill="#fff" stroke-width="1.2"/>
    <circle cx="12" cy="-3.9" r="1" fill="#0b1a33" stroke="none"/>
    <path d="M14.2 -2.6 L19.2 -1 L14.4 0.9 Z" fill="#ffd23f" stroke-width="1.3"/>
    <path d="M-3 -4.5 Q-7 -14 -1 -17 Q1 -10 4 -5" fill="#123a73" transform="rotate(-28 0.5 -4.75)"/>
  </g>
</svg>
