<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The Prototypes folder, with ball-pit balls spilling out of it -->
  <defs>
    <linearGradient id="pg-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d774"/>
      <stop offset="1" stop-color="#d9a52b"/>
    </linearGradient>
    <linearGradient id="pg-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffefa8"/>
      <stop offset="0.5" stop-color="#fbd65c"/>
      <stop offset="1" stop-color="#e8b23a"/>
    </linearGradient>
    <radialGradient id="pg-red" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#e8483f"/><stop offset="1" stop-color="#a3221c"/>
    </radialGradient>
    <radialGradient id="pg-blue" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#9ccdff"/><stop offset="0.5" stop-color="#2f86d6"/><stop offset="1" stop-color="#17508c"/>
    </radialGradient>
    <radialGradient id="pg-green" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#a6eaa0"/><stop offset="0.5" stop-color="#3bb54a"/><stop offset="1" stop-color="#1d7a2a"/>
    </radialGradient>
    <radialGradient id="pg-purple" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#d6b3f5"/><stop offset="0.5" stop-color="#9b5ccf"/><stop offset="1" stop-color="#5e2f8a"/>
    </radialGradient>
  </defs>
  <!-- back panel with tab -->
  <path d="M4 12.5 Q4 10 6.5 10 H17 L20.5 13.5 H41.5 Q44 13.5 44 16 V38 Q44 40.5 41.5 40.5 H6.5 Q4 40.5 4 38 Z" fill="url(#pg-back)" stroke="#a87512" stroke-width="1.3"/>
  <!-- balls inside, peeking over the flap -->
  <circle cx="13" cy="17.5" r="5" fill="url(#pg-blue)" stroke="#17508c" stroke-width="0.6"/>
  <circle cx="22" cy="15" r="5" fill="url(#pg-green)" stroke="#1d7a2a" stroke-width="0.6"/>
  <circle cx="31" cy="16.5" r="5" fill="url(#pg-red)" stroke="#a3221c" stroke-width="0.6"/>
  <circle cx="38.5" cy="18" r="4.2" fill="url(#pg-purple)" stroke="#5e2f8a" stroke-width="0.6"/>
  <!-- front flap -->
  <path d="M4 21 Q4 19 6 19 H42 Q44 19 44 21 V38 Q44 40.5 41.5 40.5 H6.5 Q4 40.5 4 38 Z" fill="url(#pg-front)" stroke="#a87512" stroke-width="1.3"/>
  <path d="M6 21.5 H42" stroke="#fff6cc" stroke-width="1" stroke-opacity="0.9"/>
  <!-- a ball that bounced out, front right -->
  <circle cx="39" cy="38" r="5.5" fill="#f6c21c" stroke="#b98a00" stroke-width="0.7"/>
  <ellipse cx="37" cy="35.8" rx="1.8" ry="1.1" transform="rotate(-35 37 35.8)" fill="#fff" fill-opacity="0.8"/>
  <ellipse cx="11.2" cy="15.8" rx="1.5" ry="0.9" transform="rotate(-35 11.2 15.8)" fill="#fff" fill-opacity="0.75"/>
  <ellipse cx="20.2" cy="13.3" rx="1.5" ry="0.9" transform="rotate(-35 20.2 13.3)" fill="#fff" fill-opacity="0.75"/>
  <ellipse cx="29.2" cy="14.8" rx="1.5" ry="0.9" transform="rotate(-35 29.2 14.8)" fill="#fff" fill-opacity="0.75"/>
</svg>
